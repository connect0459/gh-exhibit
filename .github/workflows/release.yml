name: Release

on:
  push:
    tags:
      - "v*"

run-name: Release ${{ github.ref_name }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # goreleaser creates the GitHub Release itself (see .goreleaser.yml) and
  # attaches the built binaries to it. Its own changelog generation is
  # disabled, so the release it creates has placeholder notes; the
  # create-release job below fills in the real notes afterwards, once the
  # binaries are confirmed attached.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # A "binary" format archive (see .goreleaser.yml) uploads its
          # release asset under archives.name_template, but leaves the
          # actual file on disk at its build-id directory, e.g.
          # dist/gh-exhibit_linux_amd64_v1/gh-exhibit — never at a
          # dist/gh-exhibit-* top-level path.
          subject-path: "${{ github.workspace }}/dist/gh-exhibit_*/gh-exhibit*"

  # Extracts this tag's section from CHANGELOG.md and updates the GitHub
  # Release goreleaser already created, replacing its placeholder notes.
  # Runs only after goreleaser has successfully attached the binaries, so a
  # release with real notes never exists for a build that failed.
  create-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changelog
        uses: connect0459/extract-changelog-entry@ff85c8909583ffaa58df10a9f07f70752f860419 # v1.1.0
        with:
          ref-name: ${{ github.ref_name }}

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.release-notes-path }}
