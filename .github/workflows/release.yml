name: Release

on:
  push:
    tags:
      - "v*"

run-name: Release ${{ github.ref_name }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Extracts this tag's section from CHANGELOG.md and creates the GitHub
  # Release from it before goreleaser runs, so mode: keep-existing (see
  # .goreleaser.yml) has an existing release whose title/notes it leaves
  # untouched and only attaches binaries to.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract changelog section for this version
        id: changelog
        uses: connect0459/extract-changelog@d1a123486c1f4d24327a5d28c7ffa5c788b02a04 # v1.0.0
        with:
          ref-name: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.release-notes-path }}

  release:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          # A "binary" format archive (see .goreleaser.yml) uploads its
          # release asset under archives.name_template, but leaves the
          # actual file on disk at its build-id directory, e.g.
          # dist/gh-exhibit_linux_amd64_v1/gh-exhibit — never at a
          # dist/gh-exhibit-* top-level path.
          subject-path: "${{ github.workspace }}/dist/gh-exhibit_*/gh-exhibit*"
